# T1 signoff re-grade (klt signoff --manifest)
#
# What this workflow is: this repo's graded position on the
# design-evidence-tiers ladder is committed under signoff/ (block manifest +
# append-only graded records). A hand-maintained list goes stale the moment
# either the evidence or the upstream checklist moves; this re-grade makes
# the drift fail a build instead.
#
# What it is deliberately not: this repo has no other CI, and the broader
# harness/evidence-format validation bar tracked on gap-to-T1 item 10
# (issue #3) is a separate, larger scope. This workflow gates only the
# signoff register.
#
# Two halves, one job:
#   - offline (before any install): manifest shape, pins vs. committed
#     artifacts, record consistency -- stdlib-only, no klt, no network;
#   - online: installs `klt` at the revision pinned in signoff/klt-pin.txt and
#     re-grades the manifest, diffing against the committed verdict of
#     record. Needs no PDK, no ngspice and no klayout install of its own
#     (klayout ships a wheel, pulled in as a klt dependency).
#
# If the online half is ever unavailable (an upstream fetch failure, an
# Actions outage), the offline half still runs in the same job and gates
# every push and PR it can.

name: signoff

on:
  push:
  pull_request:

jobs:
  signoff:
    name: T1 signoff register (offline checks + klt re-grade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, on purpose: the append-only evidence gate below
          # compares against the PR base / push `before` commit, which a
          # default depth-1 checkout does not contain.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Evidence is append-only against the previous tree (offline)
        # Rejects modification, deletion, rename or mode change of any
        # previously committed file under sim/*/{records,netlist-snapshots,
        # corners}/, signoff/reports/ or signoff/characterization/reports/.
        # New paths and edits to selectors/generators/READMEs pass. Explicit
        # comparison commits: pull_request -> PR base SHA vs the tested tree
        # (HEAD, the merge commit); push -> event `before` vs HEAD (the whole
        # multi-commit push). An all-zero `before` (first push of a branch)
        # has no previous tree and passes with an explicit notice; the PR run
        # gates that branch. A base that cannot be obtained fails with a
        # diagnostic, never a silent pass. No bypass label. Git + stdlib only.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          [ -n "${base}" ] || { echo "no comparison base for event ${EVENT_NAME}" >&2; exit 2; }
          if ! [[ "${base}" =~ ^0+$ ]] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${base}" || true
          fi
          python3 sim/tools/check_append_only_evidence.py --base "${base}" --head HEAD

      - name: Append-only gate negative controls (offline)
        run: python3 -m unittest discover -s sim/tools -p 'test_check_append_only_evidence.py' -v

      - name: Shared klt envelope gate negative controls (offline)
        # sim/tools/klt_envelope.py: the validation core every
        # sim/*/klt/compare.py imports. Stdlib only; no ngspice, PDK or klt.
        run: python3 -m unittest discover -s sim/tools -p 'test_klt_envelope.py' -v

      - name: Offline checks (manifest, pins, record consistency)
        # Includes `signoff/characterization/generate.py --check`: the T1
        # item 8 report is re-derived from the committed sim/ records it
        # selects (no ngspice, no PDK) and must match the cited record.
        run: python3 signoff/check_signoff.py

      - name: Item 1/9/10 inventory entries still hold (offline)
        # The generic envelopes bind the inventories' bytes; this re-checks
        # what the inventories *name*: source/artifact paths, bench runners
        # (exist, executable, `bash -n`), templates, cited records, and the
        # documentation headings. Static facts only -- not netlist
        # equivalence, byte freshness, or a re-run of any bench.
        run: python3 signoff/check_inventories.py

      - name: Inventory validator negative controls (offline)
        run: python3 -m unittest discover -s signoff -p 'test_check_inventories.py' -v

      - name: Integrator view is in step with the newest record (offline)
        # spec/integrator.json's maturity counts, source record and GDS path
        # are derived from the newest committed signoff record; a new report
        # without `python3 signoff/sync_integrator.py --update` fails here.
        run: python3 signoff/sync_integrator.py --check

      - name: Integrator ports and ratified bounds match their sources (offline)
        # Read-only contract check (signoff/check_integrator_contract.py):
        # spec/integrator.json ports against design/opamp_core.sym and every
        # spec_rows_ratified number against its anchored bound in
        # spec/target-spec.md. Separate from the managed-field sync above,
        # which never touches ports or ratified rows. Stdlib only.
        run: |
          set -euo pipefail
          python3 -I signoff/check_integrator_contract.py
          python3 -m unittest discover -s signoff -p 'test_check_integrator_contract.py' -v

      - name: Characterization report negative controls (offline)
        run: python3 -m unittest discover -s signoff/characterization -v

      - name: Signoff checker negative controls (offline)
        # Builds a throwaway fixture tree, applies one mutation per control
        # and asserts the exact diagnostic from check_signoff.py and
        # sync_integrator.py. Never touches the real checkout; no klt.
        run: python3 -m unittest discover -s signoff -p 'test_check_signoff.py' -v

      - name: Bench negative controls and evidence checkers (offline)
        # Every sim/ directory holding a test_*.py is run on its own
        # (`unittest discover -s <dir>`): bench dirs have hyphens and are not
        # packages, so one top-level discover from sim/ cannot import them.
        # New bench tests are picked up with no workflow edit. Currently:
        # input-cmr, post-layout, slew-rate/klt. Then the grid-guard refusal
        # controls and the offline ICMR evidence checker. Deliberately NOT
        # run: sim/post-layout/check_bounds.py (needs a pex report argument
        # produced by a layout/PEX run, so it is not an offline checker; its
        # logic is covered by test_post_layout.py). No klt, ngspice or PDK.
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r d; do
            echo "== unittest: ${d}"
            python3 -m unittest discover -s "${d}" -p 'test_*.py' -v
            n=$((n + 1))
          done < <(find sim -name 'test_*.py' -printf '%h\n' | sort -u)
          [ "${n}" -gt 0 ] || { echo "no sim/ test dirs found" >&2; exit 1; }
          echo "== grid-guard refusal controls"
          bash sim/tools/test-grid-guard.sh
          echo "== ICMR evidence checker"
          python3 sim/input-cmr/check_icmr_evidence.py

      - name: Offset yield-input sample-set reproduces and converter tests pass (offline)
        # signoff/yield-inputs: --check fails if the committed sample-set no
        # longer reproduces byte for byte from the committed draws CSV (even
        # when the CSV is unchanged); the tests cover duplicate/missing draw
        # indices, conflicting metadata, unknown status/mode and non-finite
        # PASS values. Stdlib only; no PDK, ngspice or klt.
        run: |
          set -euo pipefail
          python3 -I signoff/yield-inputs/offset_draws_to_sampleset.py --check
          python3 -I -m unittest discover -s signoff/yield-inputs -p 'test_offset_draws_to_sampleset.py' -v

      - name: Install klt at the pinned revision
        # Pinned, not floating: the T1 item skeleton is parsed out of
        # klayout-tools' own docs/design-evidence-tiers.md at run time, so a
        # floating main would make the committed record disagree with a
        # re-run for reasons unrelated to this block's evidence. Bumping the
        # pin is a deliberate act -- see signoff/klt-pin.txt.
        run: |
          set -euo pipefail
          pin="$(grep -v '^[[:space:]]*#' signoff/klt-pin.txt | grep -v '^[[:space:]]*$' | head -1)"
          echo "klayout-tools @ ${pin}"
          python3 -m pip install --upgrade pip
          python3 -m pip install "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@${pin}"
          klt version || true

      - name: Proposed area measurement verifies and its tests pass (offline)
        # TBD-12 draft evidence (DR-0007, proposed -- not ratified). Needs only
        # the `klayout` python module, which the klt install above pulled in;
        # install it explicitly if that ever stops being true. No PDK, klt run
        # or simulator. --check re-derives layout/opamp_core/area_measurement.json
        # from the committed GDS and never writes.
        run: |
          set -euo pipefail
          python3 -c "import klayout.db" 2>/dev/null || python3 -m pip install klayout
          python3 layout/opamp_core/measure_area.py --check
          python3 -m unittest discover -s layout/opamp_core -p 'test_measure_area.py' -v

      - name: LVS reference is fresh against the schematic netlist (offline)
        # Closes the other half of the LVS freshness chain (check_signoff.py
        # compares the committed reference's hash to each cited LVS
        # envelope's environment.reference_sha256): schematic netlist ->
        # layout device tables -> expanded reference. --check runs
        # verify_against_netlist() and diffs the regenerated reference against
        # the committed text. Needs only the klayout module; no LVS run, PDK
        # or simulator. Refresh: signoff/README.md "LVS reference freshness".
        run: |
          set -euo pipefail
          python3 layout/opamp_core/lvs_reference.py --check
          python3 -m unittest discover -s layout/opamp_core -p 'test_lvs_reference.py' -v

      - name: Re-grade the block manifest
        # `klt signoff --manifest` exits 3 when the block is not yet T1,
        # which is this block's current state and not an error --
        # check_signoff.py knows that, and fails only on a real error or on
        # any drift between the fresh grade and the committed record.
        # KLT_SIGNOFF_CMD: the install step above put the pinned revision on
        # PATH; the default (uvx at the pin) is for local use, and setting the
        # override here makes CI's "I own the revision" explicit.
        env:
          KLT_SIGNOFF_CMD: klt
        run: python3 signoff/check_signoff.py --run-klt
